name: CI

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup wix
        run: |
          dotnet tool install wix --version 7.0.1 --global
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext/7.0.1

      - name: Generate version properties
        id: version
        run: |
          cd .\src
          $path = '.\PSNLog\PSNLog.csproj'
          dotnet build $path -tl:off -p:MinVerVerbosity=detailed
          $version = dotnet msbuild $path -target:MinVer -getProperty:Version
          $assemblyVersion = dotnet msbuild $path -target:MinVer -getProperty:AssemblyVersion
          $minVerMajor = dotnet msbuild $path -target:MinVer -getProperty:MinVerMajor
          $minVerMinor = dotnet msbuild $path -target:MinVer -getProperty:MinVerMinor
          $minVerPatch = dotnet msbuild $path -target:MinVer -getProperty:MinVerPatch
          $moduleVersion = '{0}.{1}.{2}' -f $minVerMajor, $minVerMinor, $minVerPatch

          if ([string]::IsNullOrWhiteSpace($version))
          {
              throw 'Failed to parse the Version property.'
          }

          if ([string]::IsNullOrWhiteSpace($minVerMajor))
          {
              throw 'Failed to parse the build MinVerMajor property.'
          }

          if ([string]::IsNullOrWhiteSpace($minVerMinor))
          {
              throw 'Failed to parse the build MinVerMinor property.'
          }

          if ([string]::IsNullOrWhiteSpace($minVerPatch))
          {
              throw 'Failed to parse the build MinVerPatch property.'
          }

          'version={0}' -f $version |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'assemblyVersion={0}' -f $assemblyVersion |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'major={0}' -f $minVerMajor |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'minor={0}' -f $minVerMinor |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'patch={0}' -f $minVerPatch |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'moduleVersion={0}' -f $moduleVersion |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run tests
        run: |
          cd .\src
          dotnet.exe test --project .\Tests\Tests.csproj --configuration Release --output Detailed

      - name: Publish project
        run: dotnet.exe publish .\src\PSNLog\PSNLog.csproj --configuration Release --output .\publish

      - name: Prepare release
        run: Remove-Item ./publish/* -Include *.pdb,*.xml -ErrorAction Stop

      - name: Build installer
        run: |
          wix.exe `
            build `
            -arch x64 `
            -src src\Product.wxs `
            -d ProductSource="$(Resolve-Path ./publish)" `
            -d HelpSource="$(Resolve-Path ./maml/PSNLog)" `
            -d ProductVersion="${{ steps.version.outputs.assemblyVersion }}" `
            -d ProductTag="${{ steps.version.outputs.version }}" `
            -d ModuleVersion="${{ steps.version.outputs.moduleVersion }}" `
            -ext WixToolset.UI.wixext `
            -out ps-nlog.msi

      - name: Validate installer
        run: wix.exe msi validate -sice ICE61 ps-nlog.msi

      - name: Upload msi artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./ps-nlog.msi
          if-no-files-found: error

      - name: Install msi
        run: |
          $process = Start-Process msiexec.exe -ArgumentList '/i','ps-nlog.msi','/qn' -Wait -NoNewWindow -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0)
          {
              throw 'Non zero exit code: "{0}".' -f $process.ExitCode
          }

      - name: Test module
        shell: powershell
        run: |
          $PSVersionTable |Out-String

          Import-Module PSNLog -ErrorAction Stop
          Get-Module PSNLog |Select-Object -ExpandProperty Path |Split-Path -Parent |Get-ChildItem -Recurse

          $logger = New-NLogBasicLogger -Name foo -Path foo.log -ErrorAction Stop
          $logger.Info('Hello World!')
          Stop-NLogLogging

      - name: Publish release
        if: github.ref_type == 'tag'
        run: gh.exe release create ${{ steps.version.outputs.version }} --title ${{ steps.version.outputs.version }} --notes 'PowerShell NLog logging module.' ps-nlog.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
